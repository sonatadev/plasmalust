palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "{{ foreground | blend(color1) | lighten(0.2) }}"
flamingo = "{{ color5 | blend(color1) | lighten(0.1) }}"
pink = "{{ color5 | lighten(0.2) }}"
mauve = "{{ color5 }}"
red = "{{ color1 }}"
maroon = "{{ color1 | darken(0.15) }}"
peach = "{{ color3 | blend(color1) }}"
yellow = "{{ color3 }}"
green = "{{ color2 }}"
teal = "{{ color6 | blend(color2) }}"
sky = "{{ color6 }}"
sapphire = "{{ color6 | darken(0.1) }}"
blue = "{{ color4 }}"
lavender = "{{ color4 | lighten(0.2) }}"
text = "{{ foreground }}"
subtext1 = "{{ foreground | darken(0.1) }}"
subtext0 = "{{ foreground | darken(0.2) }}"
overlay2 = "{{ foreground | darken(0.3) }}"
overlay1 = "{{ foreground | darken(0.4) }}"
overlay0 = "{{ foreground | darken(0.5) }}"
surface2 = "{{ background | lighten(0.3) }}"
surface1 = "{{ background | lighten(0.2) }}"
surface0 = "{{ background | lighten(0.1) }}"
base = "{{ background }}"
mantle = "{{ background | darken(0.1) }}"
crust = "{{ background | darken(0.2) }}"

## FIRST LINE/ROW: Info & Status
[username]
format = " [$user]($style)@"
show_always = true
style_root = "bold red"
style_user = "bold mauve"

[hostname]
disabled = false
format = "[$hostname]($style) in "
ssh_only = false
style = "bold maroon"
ssh_symbol = " "

[directory]
style = "bold peach"
truncate_to_repo = true
truncation_length = 0
truncation_symbol = "repo: "
read_only = ""

[git_metrics]
disabled = false
added_style = 'bold green'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[sudo]
disabled = false

[git_status]
ahead = "${count}"
behind = "${count}"
deleted = "x"
diverged = "${ahead_count}${behind_count}"
style = "text"

[git_branch]
symbol = " "
style = "bold green"

[nix_shell]
format = 'via [$symbol(($name))]($style) '
symbol = " "

[cmd_duration]
disabled = false
style="bold flamingo"
format = "took [$duration]($style)"
show_milliseconds = true
show_notifications = true
min_time_to_notify = 30_000

## SECOND LINE/ROW: Prompt
[battery]
charging_symbol = ""
disabled = true
discharging_symbol = ""
full_symbol = ""

[[battery.display]] # "bold red" style when capacity is between 0% and 15%
disabled = false
style = "bold red"
threshold = 15

[[battery.display]] # "bold peach" style when capacity is between 15% and 50%
disabled = true
style = "bold peach"
threshold = 50

[[battery.display]] # "bold green" style when capacity is between 50% and 90%
disabled = true
style = "bold green"
threshold = 90

[status]
disabled = false
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
pipestatus = true
symbol = "✖"
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = "󰟾"
signal_symbol = ""

[os]
disabled = false
format = ' [$symbol]($style)'
style = "bold mauve"

[character]
error_symbol = ""
success_symbol = "[❯](bold green)"

# SYMBOLS
[git_commit]
tag_symbol = '  '
tag_disabled = false
only_detached = false # If false, it shows the tag even if you are on a branch
