[general]
mode = normal
framerate = 30
bars = 20
autosens = 1
sensitivity = 100

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /home/YOUR_USERNAME/.cache/wallust/cava.fifo
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
integral = 77
gravity = 100
monstercat = 1
